<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="Hermiona brand">
  <rect width="1200" height="800" fill="#050505"/>

  <!-- subtle frame -->
  <rect x="48" y="48" width="1104" height="704" stroke="#1A1A1A" stroke-width="1"/>

  <!-- primary lockup centered -->
  <g transform="translate(468, 248)">
    <g stroke="#F5F5F2" stroke-width="1.5" stroke-linejoin="miter" stroke-linecap="square">
      <circle cx="32" cy="32" r="28"/>
      <path d="M32 10 L54 32 L32 54 L10 32 Z"/>
      <circle cx="32" cy="32" r="2.6" fill="#F5F5F2" stroke="none"/>
    </g>
  </g>

  <text
    x="600"
    y="380"
    fill="#F5F5F2"
    font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif"
    font-size="36"
    font-weight="300"
    letter-spacing="0.62em"
    text-anchor="middle"
  >HERMIONA</text>

  <!-- thin rule -->
  <line x1="540" y1="420" x2="660" y2="420" stroke="#2A2A2A" stroke-width="1"/>

  <text
    x="600"
    y="458"
    fill="#6A6A66"
    font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="0.48em"
    text-anchor="middle"
  >LIGHT · FILM · SILENCE</text>

  <!-- app icon sample bottom left -->
  <g transform="translate(120, 580)">
    <rect width="72" height="72" rx="16" fill="#0A0A0A" stroke="#1F1F1F" stroke-width="1"/>
    <g transform="translate(4, 4)" stroke="#F5F5F2" stroke-width="1.2" stroke-linejoin="miter">
      <circle cx="32" cy="32" r="18"/>
      <path d="M32 18 L46 32 L32 46 L18 32 Z"/>
      <circle cx="32" cy="32" r="2" fill="#F5F5F2" stroke="none"/>
    </g>
  </g>

  <!-- inverted mark sample -->
  <g transform="translate(220, 580)">
    <rect width="72" height="72" rx="16" fill="#F5F5F2"/>
    <g transform="translate(4, 4)" stroke="#0A0A0A" stroke-width="1.2" stroke-linejoin="miter">
      <circle cx="32" cy="32" r="18"/>
      <path d="M32 18 L46 32 L32 46 L18 32 Z"/>
      <circle cx="32" cy="32" r="2" fill="#0A0A0A" stroke="none"/>
    </g>
  </g>

  <!-- mono mark only -->
  <g transform="translate(320, 588)" stroke="#F5F5F2" stroke-width="1.2" stroke-linejoin="miter">
    <circle cx="28" cy="28" r="20"/>
    <path d="M28 12.5 L43.5 28 L28 43.5 L12.5 28 Z"/>
    <circle cx="28" cy="28" r="2" fill="#F5F5F2" stroke="none"/>
  </g>

  <text
    x="1080"
    y="720"
    fill="#3A3A38"
    font-family="Helvetica Neue, Helvetica, Arial, system-ui, sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="0.35em"
    text-anchor="end"
  >MARK · IRIS</text>
</svg>
